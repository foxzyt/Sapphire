name: Feature request
description: Suggest a new language feature, standard library function, or tooling improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do that Sapphire makes hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to see. If it is a language feature, a sketch of the syntax in a code block helps a lot.
      placeholder: |
        // example of how the feature could look in Sapphire
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to achieve the same thing, and why they fall short.
    validations:
      required: false
