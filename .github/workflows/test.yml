name: Run Tests

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-sfml
            mingw-w64-x86_64-openssl

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSFML_DIR=/mingw64/lib/cmake/SFML \
            -DSFML_STATIC_LIBRARIES=ON \
            -DOPENSSL_ROOT_DIR=/mingw64 \
            -DOPENSSL_USE_STATIC_LIBS=TRUE

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --config Release --parallel

      - name: Run test suite
        shell: msys2 {0}
        run: |
          set -e
          PASS=0
          FAIL=0
          SKIP=0
          
          # Test files to run (general mechanics)
          TESTS=(
            "tests/calculator.sp"
            "tests/test_arrow_functions.sp"
            "tests/test_array_spread.sp"
            "tests/test_async_operations.sp"
            "tests/test_bitwise_operations.sp"
            "tests/test_bitwise.sp"
            "tests/test_bitwise_switch.sp"
            "tests/test_exceptions.sp"
            "tests/test_exceptions_complex.sp"
            "tests/test_finally.sp"
            "tests/test_for_loop.sp"
            "tests/test_for_loop_complex.sp"
            "tests/test_inheritance.sp"
            "tests/test_inheritance_complex.sp"
            "tests/test_iterators.sp"
            "tests/test_json.sp"
            "tests/test_list.sp"
            "tests/test_loop.sp"
            "tests/test_loop_controls.sp"
            "tests/test_map.sp"
            "tests/test_math.sp"
            "tests/test_optional_chaining.sp"
            "tests/test_shorthand_maps.sp"
            "tests/test_string_interpolation.sp"
            "tests/test_strings.sp"
            "tests/test_switch.sp"
            "tests/test_syntax.sp"
            "tests/test_syntax_v109.sp"
            "tests/test_ternary.sp"
            "tests/test_ternary_complex.sp"
            "tests/test_types.sp"
            "tests/test2.sp"
            "tests/test3.sp"
          )
          
          # Module-based tests
          MODULE_TESTS=(
            "tests/module/test_io_module.sp"
            "tests/module/test_json_module.sp"
            "tests/module/test_list_util_module.sp"
            "tests/module/test_math_advanced.sp"
            "tests/module/test_math_module.sp"
            "tests/module/test_sqlite_module.sp"
            "tests/module/test_string_module.sp"
            "tests/module/test_system_module.sp"
          )
          
          echo "=== Running General Tests ==="
          for test in "${TESTS[@]}"; do
            if [ -f "$test" ]; then
              echo "Running: $test"
              if ./build/sapphire.exe "$test" 2>&1; then
                echo "PASS: $test"
                PASS=$((PASS + 1))
              else
                echo "FAIL: $test"
                FAIL=$((FAIL + 1))
              fi
            else
              echo "SKIP (not found): $test"
              SKIP=$((SKIP + 1))
            fi
            echo ""
          done
          
          echo "=== Running Module Tests ==="
          for test in "${MODULE_TESTS[@]}"; do
            if [ -f "$test" ]; then
              echo "Running: $test"
              if ./build/sapphire.exe "$test" 2>&1; then
                echo "PASS: $test"
                PASS=$((PASS + 1))
              else
                echo "FAIL: $test"
                FAIL=$((FAIL + 1))
              fi
            else
              echo "SKIP (not found): $test"
              SKIP=$((SKIP + 1))
            fi
            echo ""
          done
          
          echo "=============================="
          echo "Results: $PASS passed, $FAIL failed, $SKIP skipped"
          
          if [ $FAIL -gt 0 ]; then
            exit 1
          fi