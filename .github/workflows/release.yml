name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Cache vcpkg binary packages
      uses: actions/cache@v4
      with:
        path: C:/Users/runneradmin/AppData/Local/vcpkg/archives
        key: vcpkg-openssl-x64-windows-static-v1

    - name: Install OpenSSL (vcpkg, x64-windows-static)
      run: vcpkg install openssl:x64-windows-static

    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build `
          -DCMAKE_BUILD_TYPE=Release `
          -DOPENSSL_ROOT_DIR="C:/vcpkg/installed/x64-windows-static" `
          -DOPENSSL_USE_STATIC_LIBS=TRUE

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release

    - name: Package Artifacts
      shell: powershell
      run: |
        mkdir release_artifacts
        copy build\Release\sapphire.exe release_artifacts\
        copy build\Release\runner.exe release_artifacts\
        copy build\Release\mine.exe release_artifacts\
        copy build\Release\spack.exe release_artifacts\
        Compress-Archive -Path release_artifacts\* -DestinationPath sapphire-windows.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: sapphire-windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
