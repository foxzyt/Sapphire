name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-sfml
            mingw-w64-x86_64-openssl

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSFML_DIR=/mingw64/lib/cmake/SFML \
            -DSFML_STATIC_LIBRARIES=ON \
            -DOPENSSL_ROOT_DIR=/mingw64 \
            -DOPENSSL_USE_STATIC_LIBS=TRUE

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --config Release --parallel

      - name: Package artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release_artifacts | Out-Null
          if (Test-Path build/sapphire.exe) { Copy-Item build/sapphire.exe release_artifacts/ }
          if (Test-Path build/runner.exe) { Copy-Item build/runner.exe release_artifacts/ }
          if (Test-Path build/mine.exe) { Copy-Item build/mine.exe release_artifacts/ }
          if (Test-Path build/spack.exe) { Copy-Item build/spack.exe release_artifacts/ }
          if (Test-Path README.md) { Copy-Item README.md release_artifacts/ }
          Compress-Archive -Path release_artifacts/* -DestinationPath sapphire-windows.zip -Force

      - name: Fetch tag history
        shell: bash
        run: |
          set -e
          git fetch --tags --force
          PREV_TAG="$(git tag --sort=-version:refname | grep -E '^v[0-9]' | head -n 2 | tail -n 1 || true)"
          echo "PREV_TAG=${PREV_TAG}" >> "$GITHUB_ENV"

      - name: Run Copilot Release Notes
        id: copilot_release
        uses: github/copilot-release-notes@v1
        with:
          base-ref: ${{ env.PREV_TAG != '' && env.PREV_TAG || github.event.repository.default_branch }}
          head-ref: ${{ github.ref_name }}
          instructions: ".github/release-notes-instructions.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release draft
        uses: softprops/action-gh-release@v2
        with:
          files: sapphire-windows.zip
          tag_name: ${{ github.ref_name }}
          name: Sapphire ${{ github.ref_name }}
          body: ${{ steps.copilot_release.outputs.markdown }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
