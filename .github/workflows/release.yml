name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup MSYS2 (MINGW64)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false
        install: >-
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make

    - name: Configure CMake
      shell: msys2 {0}
      run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

    - name: Build
      shell: msys2 {0}
      run: cmake --build build --config Release

    - name: Package Artifacts
      run: |
        mkdir release_artifacts
        copy build\sapphire.exe release_artifacts\
        copy build\runner.exe release_artifacts\
        copy build\mine.exe release_artifacts\
        copy build\spack.exe release_artifacts\
        Compress-Archive -Path release_artifacts\* -DestinationPath sapphire-windows.zip
      shell: powershell

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: sapphire-windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
