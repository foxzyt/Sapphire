name: Criar Rascunho de Release com Copilot

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  create-draft-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag and inject diff
        id: prev_tag
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match="v[0-9]*" 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -n 1)
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT
          
          # O git diff excede 100,000 chars, o Copilot falha se passarmos o diff bruto.
          # Vamos injetar os exemplos manualmente após o Copilot gerar o resumo do PR.

      - name: Rodar Copilot Release Notes
        id: copilot_release
        uses: github/copilot-release-notes@v1
        with:
          base-ref: ${{ steps.prev_tag.outputs.tag }}
          head-ref: ${{ github.sha }}
          instructions: .github/release-notes-instructions.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}

      - name: Prepare release body
        shell: bash
        env:
          MARKDOWN: ${{ steps.copilot_release.outputs.release-notes }}
        run: |
          set -e
          if [ -n "$MARKDOWN" ]; then
            echo "$MARKDOWN" > release_body.md
            # Adiciona o guia do MinGW de forma fixa caso o Copilot esqueça
            echo "" >> release_body.md
            
            # Anexa os exemplos de código de forma estática para garantir que apareçam
            cat .github/v1.0.8-examples.md >> release_body.md
            
            echo "## How to Compile (MinGW)" >> release_body.md
            echo "" >> release_body.md
            echo "To build Sapphire from source on Windows using MSYS2 and MinGW:" >> release_body.md
            echo "" >> release_body.md
            echo "1. Install [MSYS2](https://www.msys2.org/)." >> release_body.md
            echo "2. Open the **MSYS2 MINGW64** terminal and install the dependencies:" >> release_body.md
            echo "   \`\`\`bash" >> release_body.md
            echo "   pacman -S mingw-w64-x86_64-cmake mingw-w64-x86_64-gcc mingw-w64-x86_64-make mingw-w64-x86_64-sfml mingw-w64-x86_64-openssl" >> release_body.md
            echo "   \`\`\`" >> release_body.md
            echo "3. Clone the repository:" >> release_body.md
            echo "   \`\`\`bash" >> release_body.md
            echo "   git clone https://github.com/foxzyt/Sapphire.git" >> release_body.md
            echo "   cd Sapphire" >> release_body.md
            echo "   \`\`\`" >> release_body.md
            echo "4. Configure and build:" >> release_body.md
            echo "   \`\`\`bash" >> release_body.md
            echo "   cmake -B build -G \"MinGW Makefiles\" -DCMAKE_BUILD_TYPE=Release -DSFML_DIR=/mingw64/lib/cmake/SFML -DSFML_STATIC_LIBRARIES=ON -DOPENSSL_ROOT_DIR=/mingw64 -DOPENSSL_USE_STATIC_LIBS=TRUE" >> release_body.md
            echo "   cmake --build build --config Release -j 8" >> release_body.md
            echo "   \`\`\`" >> release_body.md
          else
            echo "# Draft release" > release_body.md
            echo "" >> release_body.md
            echo "Generated from merged pull request #${{ github.event.pull_request.number }}." >> release_body.md
            echo "" >> release_body.md
            echo "## Changes" >> release_body.md
            git log --pretty=format:'- %s (%h)' "${{ steps.prev_tag.outputs.tag }}".."${{ github.sha }}" >> release_body.md
          fi

      - name: Create temporary tag
        shell: bash
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v-draft-${{ github.run_number }}" "${{ github.event.pull_request.merge_commit_sha }}"
          git push origin "v-draft-${{ github.run_number }}"

      - name: Criar Rascunho no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-draft-${{ github.run_number }}
          name: Rascunho de Release #${{ github.run_number }}
          body_path: release_body.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
