name: Criar Rascunho de Release com Copilot

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  create-draft-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag and inject diff
        id: prev_tag
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match="v[0-9]*" 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -n 1)
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT
          
          # O git diff excede 100,000 chars, o Copilot falha se passarmos o diff bruto.
          # Vamos injetar os exemplos manualmente após o Copilot gerar o resumo do PR.

      - name: Rodar Copilot Release Notes
        id: copilot_release
        uses: github/copilot-release-notes@v1
        with:
          base-ref: ${{ steps.prev_tag.outputs.tag }}
          head-ref: ${{ github.sha }}
          instructions: .github/release-notes-instructions.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}

      - name: Prepare release body
        shell: bash
        env:
          MARKDOWN: ${{ steps.copilot_release.outputs.release-notes }}
        run: |
          set -e
          if [ -n "$MARKDOWN" ]; then
            echo "$MARKDOWN" > release_body.md
          else
            echo "# Draft release" > release_body.md
            echo "" >> release_body.md
            echo "Generated from merged pull request #${{ github.event.pull_request.number }}." >> release_body.md
            echo "" >> release_body.md
            echo "## Changes" >> release_body.md
            git log --pretty=format:'- %s (%h)' "${{ steps.prev_tag.outputs.tag }}".."${{ github.sha }}" >> release_body.md
          fi

          # Anexa os exemplos e o guia do MinGW em ambos os caminhos,
          # mesmo quando o Copilot falha e usamos o fallback.
          echo "" >> release_body.md
          cat .github/release-examples.md >> release_body.md
          cat .github/release-footer.md >> release_body.md

      - name: Criar Rascunho no GitHub
        uses: softprops/action-gh-release@v2
        with:
          # No real tag is pushed: with draft: true, GitHub holds this tag name
          # as pending until someone publishes the draft. Pushing the tag here
          # used to trigger release.yml and publish a real release on every merge.
          tag_name: v-next-${{ github.run_number }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          name: "Rascunho de Release #${{ github.run_number }}"
          body_path: release_body.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
