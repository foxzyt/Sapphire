name: Criar Rascunho de Release com Copilot

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  create-draft-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release instructions
        id: release_instructions
        shell: bash
        run: |
          echo "instructions<<EOF" >> "$GITHUB_OUTPUT"
          cat .github/release-notes-instructions.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Rodar Copilot Release Notes
        id: copilot_release
        uses: github/copilot-release-notes@v1
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
          instructions: ${{ steps.release_instructions.outputs.instructions }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release body
        shell: bash
        run: |
          set -e
          if [ -n "${{ steps.copilot_release.outputs.markdown }}" ]; then
            printf '%s
' "${{ steps.copilot_release.outputs.markdown }}" > release_body.md
          else
            cat > release_body.md <<EOF
          # Draft release

          Generated from merged pull request #${{ github.event.pull_request.number }}.

          ## Changes
          EOF
            git log --pretty=format:'- %s (%h)' "${{ github.event.pull_request.base.sha }}".."${{ github.event.pull_request.head.sha }}" >> release_body.md
          fi

      - name: Create temporary tag
        shell: bash
        run: |
          set -e
          git tag "v-draft-${{ github.run_number }}" "${{ github.event.pull_request.merge_commit_sha }}"
          git push origin "v-draft-${{ github.run_number }}"

      - name: Criar Rascunho no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-draft-${{ github.run_number }}
          name: Rascunho de Release #${{ github.run_number }}
          body_path: release_body.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
