name: Criar Rascunho de Release com Copilot

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  create-draft-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev_tag
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match="v[0-9]*" 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -n 1)
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Rodar Copilot Release Notes
        id: copilot_release
        uses: github/copilot-release-notes@v1
        with:
          base-ref: ${{ steps.prev_tag.outputs.tag }}
          head-ref: ${{ github.sha }}
          instructions: .github/release-notes-instructions.md
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}

      - name: Prepare release body
        shell: bash
        env:
          MARKDOWN: ${{ steps.copilot_release.outputs.markdown }}
        run: |
          set -e
          if [ -n "$MARKDOWN" ]; then
            echo "$MARKDOWN" > release_body.md
          else
            echo "# Draft release" > release_body.md
            echo "" >> release_body.md
            echo "Generated from merged pull request #${{ github.event.pull_request.number }}." >> release_body.md
            echo "" >> release_body.md
            echo "## Changes" >> release_body.md
            git log --pretty=format:'- %s (%h)' "${{ steps.prev_tag.outputs.tag }}".."${{ github.sha }}" >> release_body.md
          fi

      - name: Create temporary tag
        shell: bash
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v-draft-${{ github.run_number }}" "${{ github.event.pull_request.merge_commit_sha }}"
          git push origin "v-draft-${{ github.run_number }}"

      - name: Criar Rascunho no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-draft-${{ github.run_number }}
          name: Rascunho de Release #${{ github.run_number }}
          body_path: release_body.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
