name: CI Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-pages:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        build_type: [Release]

    steps:
    - uses: actions/checkout@v4

    # Install SFML and OpenSSL from MSYS2 MINGW64 packages.
    # These are compiled with the same GCC version used to compile the project,
    # eliminating all ABI mismatches that occur with the pre-built libs.zip.
    - name: Setup MSYS2 (MINGW64) with SFML + OpenSSL
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-sfml
          mingw-w64-x86_64-openssl

    - name: Configure CMake
      shell: msys2 {0}
      run: |
        cmake -B build -G "MinGW Makefiles" \
          -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
          -DSFML_DIR=/mingw64/lib/cmake/SFML \
          -DSFML_STATIC_LIBRARIES=ON \
          -DOPENSSL_ROOT_DIR=/mingw64 \
          -DOPENSSL_USE_STATIC_LIBS=TRUE

    - name: Build
      shell: msys2 {0}
      run: cmake --build build --config ${{matrix.build_type}}

    - name: Test Execute
      shell: msys2 {0}
      run: |
        ./build/sapphire.exe tests/test_syntax.sp
        ./build/sapphire.exe tests/test_loop.sp
        ./build/sapphire.exe tests/test_list.sp
        ./build/sapphire.exe tests/test_math.sp
        ./build/sapphire.exe tests/test_types.sp
        ./build/sapphire.exe tests/test_map.sp
        ./build/sapphire.exe tests/test_iterators.sp
        ./build/sapphire.exe tests/test_sqlite.sp
