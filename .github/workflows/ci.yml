name: CI Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        build_type: [Release]

    steps:
    - uses: actions/checkout@v3

    # Cache vcpkg binary packages so OpenSSL isn't recompiled every run
    - name: Cache vcpkg binary packages
      uses: actions/cache@v4
      with:
        path: C:/Users/runneradmin/AppData/Local/vcpkg/archives
        key: vcpkg-openssl-x64-windows-static-v1

    # Install MSVC-compiled static OpenSSL to match the MSVC-compiled SFML/FreeType in libs.zip
    - name: Install OpenSSL (vcpkg, x64-windows-static)
      run: vcpkg install openssl:x64-windows-static

    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build `
          -DCMAKE_BUILD_TYPE=${{matrix.build_type}} `
          -DOPENSSL_ROOT_DIR="C:/vcpkg/installed/x64-windows-static" `
          -DOPENSSL_USE_STATIC_LIBS=TRUE

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{matrix.build_type}}

    - name: Test Execute
      shell: powershell
      run: |
        .\build\Release\sapphire.exe tests\test_syntax.sp
        .\build\Release\sapphire.exe tests\test_loop.sp
        .\build\Release\sapphire.exe tests\test_list.sp
        .\build\Release\sapphire.exe tests\test_math.sp
        .\build\Release\sapphire.exe tests\test_types.sp
        .\build\Release\sapphire.exe tests\test_map.sp
