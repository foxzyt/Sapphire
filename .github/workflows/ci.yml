name: CI Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel superseded runs when new commits are pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-pages:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Only this job needs to write to Pages; the build job runs with the
    # read-only default from the top level.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        build_type: [Release]
    env:
      # Pin the ccache dir to the workspace so the msys2 shell (native ccache
      # binary) and actions/cache (host runner) agree on the same location.
      CCACHE_DIR: ${{ github.workspace }}\.ccache

    steps:
    - uses: actions/checkout@v4

    # Install SFML and OpenSSL from MSYS2 MINGW64 packages.
    # These are compiled with the same GCC version used to compile the project,
    # eliminating all ABI mismatches that occur with the pre-built libs.zip.
    - name: Setup MSYS2 (MINGW64) with SFML + OpenSSL
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: >-
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-sfml
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-ccache

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Configure CMake
      shell: msys2 {0}
      run: |
        cmake -B build -G "MinGW Makefiles" \
          -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DSFML_DIR=/mingw64/lib/cmake/SFML \
          -DSFML_STATIC_LIBRARIES=ON \
          -DOPENSSL_ROOT_DIR=/mingw64 \
          -DOPENSSL_USE_STATIC_LIBS=TRUE

    - name: Build
      shell: msys2 {0}
      run: cmake --build build --config ${{matrix.build_type}}

    - name: Test Execute
      shell: msys2 {0}
      run: bash tests/run_tests.sh ./build/sapphire.exe
